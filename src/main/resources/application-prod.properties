spring.application.name=electricitybusiness

# Hibernate/MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Datasource
spring.datasource.url=jdbc:mysql://${JDBC_HOST:eb-mysql}:3306/eb_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:prod_user}
spring.datasource.password=${DB_PASS:secure_password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# MongoDB (production)
spring.data.mongodb.host=${MONGO_HOST:eb-mongodb}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=eb_db
spring.data.mongodb.username=${MONGO_USER:mongo_user}
spring.data.mongodb.password=${MONGO_PASS:mongo_password}
spring.data.mongodb.authentication-database=admin

# Logging minimal en production
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.humanbooster.exam_spring=INFO

# Actuator
management.endpoint.health.show-details=never

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}