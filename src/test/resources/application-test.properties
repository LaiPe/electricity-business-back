# Configuration de test avec H2 en mémoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA pour les tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Forcer l'utilisation du dialecte H2 pour éviter les conflits avec MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configuration H2 Console (optionnel pour debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration de validation
spring.jpa.defer-datasource-initialization=true

# Logging pour les tests
logging.level.org.springframework.web=DEBUG
logging.level.com.laipe.electricitybusiness=DEBUG 