services:
  mysql:
    image: mysql:8.3
    container_name: electricity-business-mysql
    env_file:
      - .env.prod
    volumes:
      - mysql_data_prod:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - eb-network
    user: "999:993"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL  # Aucune capability nécessaire
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    # Filesystem en lecture seule (empêche l'écriture sauf volumes)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m          # Fichiers temporaires InnoDB
      - /var/run/mysqld:noexec,nosuid,size=100m  # Socket et PID files

  mongodb:
    image: mongo:7.0
    container_name: electricity-business-mongodb
    env_file:
      - .env.prod
    volumes:
      - mongodb_data_prod:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - eb-network

  app:
    image: ghcr.io/laipe/laipe/electricity-business-back:latest
    container_name: electricity-business-api
    restart: always
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/eb-app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - caddy_network
      - eb-network
    user: "999:993"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL  # Aucune capability nécessaire
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m  # Fichiers temporaires Spring

volumes:
  mysql_data_prod:
    driver: local
  mongodb_data_prod:
    driver: local
  app_logs:
    driver: local

networks:
  caddy_network:
    external: true
  eb-network:
    driver: bridge
    internal: true  # Réseau complètement isolé
