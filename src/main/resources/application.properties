spring.application.name=electricitybusiness

# ===================================================================
# CONFIGURATION MySQL (JPA/Hibernate)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:mysql://eb-mysql:3306/eb_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURATION MongoDB
# ===================================================================
spring.data.mongodb.host=eb-mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=eb_db
spring.data.mongodb.username=admin
spring.data.mongodb.password=adminpassword
spring.data.mongodb.authentication-database=admin