spring.application.name=electricitybusiness

# Hibernate/MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Datasource
spring.datasource.url=jdbc:mysql://${PREPROD_JDBC_HOST:preprod-mysql}:3306/eb_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${PREPROD_DB_USER:preprod_user}
spring.datasource.password=${PREPROD_DB_PASS:preprod_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MongoDB
spring.data.mongodb.host=${PREPROD_MONGO_HOST:preprod-mongodb}
spring.data.mongodb.port=${PREPROD_MONGO_PORT:27017}
spring.data.mongodb.database=eb_db
spring.data.mongodb.username=${PREPROD_MONGO_USER:preprod_mongo_user}
spring.data.mongodb.password=${PREPROD_MONGO_PASS:preprod_mongo_password}
spring.data.mongodb.authentication-database=admin

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Monitoring / health
management.endpoints.web.exposure.include=health,info

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
